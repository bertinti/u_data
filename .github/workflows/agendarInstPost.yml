name: Script - Instagram Post

on:
#  schedule:
#    - cron: '37 1 * * *'  # 13h30 horário de Brasília
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar script
        env:
          SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
          GEMINI_API_KEY_KC: ${{ secrets.GEMINI_API_KEY_KC }}
          GDRIVE_CREDENTIALS_KC: ${{ secrets.GDRIVE_CREDENTIALS_KC }}
        run: python inst_post.py

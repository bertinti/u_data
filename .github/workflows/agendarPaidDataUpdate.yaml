name: Notebooks - PaidDataUpdate

on:
  workflow_dispatch:

jobs:
  
  rodar:

    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter
          pip install -r requirements.txt
      - name: Debug - List files in repository
        run: ls -la
      - name: Executar notebooks
        env:
          SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CREDENTIALS_KC: ${{ secrets.GDRIVE_CREDENTIALS_KC }}
        run: |
          papermill script_sprinklr_paid.ipynb /dev/null
